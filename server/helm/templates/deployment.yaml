apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warcraft3-server.fullname" . }}
  labels:
    {{- include "warcraft3-server.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "warcraft3-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "warcraft3-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pvpgn
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SERVER_NAME
              value: {{ .Values.server.name | quote }}
            - name: PUBLIC_IP
              value: {{ .Values.server.publicIp | quote }}
            - name: LAN_CIDR
              value: {{ .Values.server.lanCidr | quote }}
            - name: LOCAL_HOST_IP
              value: {{ .Values.server.localHostIp | quote }}
            - name: MAX_ACCOUNTS
              value: {{ .Values.server.maxAccounts | quote }}
            - name: TZ
              value: {{ .Values.server.timezone | quote }}
          ports:
            - name: game-tcp
              containerPort: 6112
              protocol: TCP
            - name: game-udp
              containerPort: 6112
              protocol: UDP
            - name: route-tcp
              containerPort: 6200
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: game-tcp
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: game-tcp
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: game-tcp
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/pvpgn
            - name: runtime
              mountPath: /run/pvpgn
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if or .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ include "warcraft3-server.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.runtime.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
