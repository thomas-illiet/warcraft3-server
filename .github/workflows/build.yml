name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  checks:
    name: Source and script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify submodule worktrees
        shell: bash
        run: |
          set -euo pipefail
          status=$(git submodule status --recursive)
          printf '%s\n' "$status"
          if printf '%s\n' "$status" | grep -Eq '^[+-]'; then
            echo 'A submodule is missing or does not match its recorded commit.' >&2
            exit 1
          fi

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $results = @('patch', 'server', 'scripts', 'tests') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_scripts < <(git ls-files '*.sh')
          shellcheck "${shell_scripts[@]}"

      - name: Validate workflow syntax
        shell: bash
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate Compose hardening
        shell: bash
        run: docker compose --file server/docker/compose.yaml config >/dev/null

      - name: Validate Helm deployment
        shell: bash
        run: |
          helm lint server/helm --strict
          helm template ci server/helm \
            --kube-version 1.25.0 \
            --set-string image.tag=ci \
            --set-string server.publicIp=203.0.113.10 >/dev/null

  patch:
    name: Windows x86 patch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build W3L patch archive
        shell: pwsh
        run: ./scripts/Build-Patch.ps1 -Archive -Version $env:VERSION

      - name: Upload patch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-patch
          path: artifacts/patch/warcraft3-patch-${{ env.VERSION }}-windows-x86.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64 server
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build portable server
        shell: bash
        run: ./scripts/build-server-linux.sh "$VERSION"

      - name: Smoke-test portable server
        shell: bash
        run: ./tests/linux-smoke.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: artifacts/server/linux/warcraft3-server-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 server
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set artifact version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            "VERSION=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV
          } else {
            "VERSION=dev-$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV
          }

      - name: Build portable server
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          try {
            ./scripts/Build-ServerWindows.ps1 -Archive -Version $env:VERSION -VcpkgRoot $vcpkgRoot
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=scripts/Build-ServerWindows.ps1::$message"
            throw
          }

      - name: Verify PE architecture
        shell: pwsh
        run: |
          $binary = 'artifacts/server/windows/warcraft3-server/bin/bnetd.exe'
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw 'bnetd.exe is not an x64 PE file.' }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: artifacts/server/windows/warcraft3-server-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  container:
    name: Rootless container
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Test rootless read-only image
        shell: bash
        run: ./tests/container-smoke.sh

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/thomas-illiet/warcraft3-server
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish container image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - checks
      - patch
      - linux
      - windows
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: sha256sum warcraft3-* > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          options=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${options[@]}"
